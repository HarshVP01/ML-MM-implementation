#############################################################
## INPUT
#############################################################

structure          /g/data/v15/hp2306/charmm/Peptides_final/pep_PRO.psf
coordinates        /g/data/v15/hp2306/charmm/Peptides_final/pep_PRO_final.pdb

set outputname     single_point_so3lr
firsttimestep      0

#############################################################
## FORCE FIELD (DUMMY — REQUIRED BY NAMD)
#############################################################

paraTypeCharmm     on
parameters         /g/data/v15/hp2306/charmm/toppar/par_all36m_prot.prm

exclude            scaled1-4
oneFourScaling     1.0

#############################################################
## NO DYNAMICS (SINGLE POINT)
#############################################################

timestep           1.0
temperature        0

#############################################################
## NO PBC (GAS PHASE)
#############################################################

cutoff             999.0
pairlistdist       1000.0
switching          off

#############################################################
## SO3LR QM FORCES (ONLY ACTIVE FORCE)
#############################################################

qmforces           on
qmParamPDB         /g/data/v15/hp2306/charmm/Peptides_final/nnp_gas.pdb

qmSoftware         custom
qmexecpath         "/g/data/v15/qz8599/conda/envs/so3lr/bin/python3 /g/data/v15/hp2306/NNP_MM/NNP-MM_SO3LR/client_SO3LR.py"

qmBaseDir          QMBASEDIR

QMColumn           occ
qmChargeMode       none
qmElecEmbed        off

#############################################################
## OUTPUT
#############################################################

outputName         /scratch/v15/hp2306/nnp_mm_output/single_point

outputEnergies     1

#############################################################
## RUN CONTROL
#############################################################
stepspercycle 10
run 10